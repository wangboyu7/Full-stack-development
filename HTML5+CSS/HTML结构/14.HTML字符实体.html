<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML字符实体</title>
</head>
<body>
    <div>他 美女</div>
    <div>他&nbsp;美女</div>
    <div>他&#160;美女</div>
    <div>我们学习过很多的标题标签，其中&lt;h1&gt;是最厉害的一个！</div>
    <div>今天学习了一个可以表示空格的字符实体，它是：&amp;nbsp;</div>
    <div>可以表示&的字符实体，它是：&amp;amp;</div>
    <div>当前商品的价格是：￥199</div>
    <div>当前商品的价格是：%yen;199</div>
    <div>©版权所有&copy;</div>
    <div>2 * 2 = 4；2 x 2 = 4；这是乘法：&times;</div>
    <div>2 / 2 = 1；2 ÷ 2 = 1；这是除法：&divide;</div>
</body>
</html>
