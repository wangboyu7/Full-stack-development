<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>列表</title>
</head>
<body>
    <!--
        注意事项：
        1.无论是有序还是无序列表，子元素都要是<li></li>，如果要写其他元素需要用li包裹其他元素
        2.<li></li>或<ul></ul>最好不要单独使用
        3.列表可以嵌套列表，嵌套一般不会超过3层
        4.自定义列表里一个术语名称可以有多个术语描述

        列表应用场景：
        有序列表侧重顺序，如1、2、3、.....
        无序列表如标题、导航、商品列表等
        自定义列表如网页底端的概述、关于、链接等
    -->
    <!-- 有序列表 -->
    <h2>要把大象放冰箱拢共份几步</h2>
    <ol>
        <li>把冰箱门打开</li>
        <li>把大象放进去</li>
        <li>把冰箱门关上</li>
        <li>
            <a href="https://www.baidu.com">去百度</a>
        </li>
    </ol>

    <!-- 无序列表 -->
    <h2>我想去的几个城市</h2>
    <ul>
        <li>成都</li>
        <li>
            <span>上海</span>
            <ul>
                <li>外滩</li>
                <li>东方明珠</li>
                <li>迪士尼乐园</li>
                <li>杜莎夫人蜡像馆</li>
            </ul>
        </li>
        <li>西安</li>
        <li>武汉</li>
    </ul>

    <!-- 自定义列表 -->
    <!-- 突出术语名称与术语描述 -->
    <h2>如何更好的学习</h2>
    <dl>
        <dt>做好笔记</dt>
        <dd>笔记是我们以后腹肌的一个抓手</dd>
        <dd>笔记可以是电子版，也可以是纸质版</dd>
        <dt>多加练习</dt>
        <dd>只有敲出来的代码，才是自己的</dd>
        <dt>别怕出错</dt>
        <dd>错是很正常的，改正后并记住，就是经验</dd>
    </dl>
</body>
</html>
