<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>框架标签</title>
</head>
<body>
    <!--利用iframe嵌入一个普通的网页，frameborder为边框-->
    <!--<iframe src="https://www.bilibili.com" width="900" height="1000" frameborder="0"></iframe>-->
    <!--利用iframe全入一个广告网页-->
    <!--利用iframe嵌入其他内容（视频、图片、动图....）-->
    <!--与超链接的target属性配合使用-->
    <a href="https://www.bilibili.com" target="bl">点我看视频</a>
    <a href="https://www.taobao.com" target="bl">点我看淘宝</a>
    <!--与表单的target属性配合使用-->
    <form action="https://www.bilibili.com/search" target="container">
        <input type="text" name="keyword">
        <input type="submit" value="搜索">
    </form>
    <iframe name="container" src="" frameborder="0" width="900" height="400"></iframe>
</body>
</html>
