<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>优先级</title>
    <style>
        h1{
            color: aqua;
        }
    </style>
</head>
<body>
    <!--行内样式优先级比内部样式要高-->
    <!--优先级：行内样式<外部样式=内部样式（后来者居上）-->
    <h1 style="color: red;">欢迎学习</h1>
</body>
</html>
