<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>通配选择器</title>
    <style>
        #happy {
            color: red;
        }
        #good {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>欢迎来到官网</h1>
    <hr>
    <h2 id="happy">欢庆语句</h2>
    <h3>作者：优秀的网友们</h3>
    <p class="say big">愿你历尽千帆，归来仍是少年</p>
    <p class="say">天天开心</p>
    <p class="say">岁岁平安</p>
    <span class="say">哈哈</span>
    <h2 id="good">节日话语</h2>
    <p class="speak">爆竹新春一岁除</p>
    <p class="speak">春风送暖入屠苏</p>
</body>
</html>
